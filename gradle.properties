org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Machine-local: AGP 9 requires JDK 17, but this machine's default `java` is 25.
# Remove this line (or override with -Dorg.gradle.java.home=...) on other machines.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home

android.useAndroidX=true
android.nonTransitiveRClass=true
